[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftnf"
version = "0.1.0"
readme = "README.md"
description = "DriftNF implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "psutil>=5.9", "torch>=2.2", "timeeval>=1.2.7", "affiliation @ git+https://github.com/ahstat/affiliation-metrics-py.git@8d8449858096bbade6a6e70848d05c9cc9b846fe"]

[tool.setuptools.packages.find]
include = ["driftnf*"]
